<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Makros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Makros</title>
<link rel="apple-touch-icon" id="icon">
<style>
:root{--bg:#fff;--ink:#000;--mute:#5c5c5c;--line:#d4d4d4;--p:#2457e6;--c:#e49b0f;--f:#e0405a;--track:#ececec;--zone:#c9d6fb}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff;--mute:#a0a0a0;--line:#333;--p:#6d93ff;--c:#f2b445;--f:#ff6b83;--track:#242424;--zone:#1f2f66}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.day{flex:1;text-align:center;line-height:1.2}
.day b{display:block;font-size:17px;font-weight:800}
.day span{font-size:13px;color:var(--mute)}
.ib{width:44px;height:44px;border:0;background:none;font-size:26px;font-weight:300}
.ib:disabled{opacity:.25}
.hero{border-top:8px solid var(--ink);padding-top:10px}
.hl{display:flex;justify-content:space-between;align-items:baseline}
.hl span{font-size:22px;font-weight:800}
.hl small{color:var(--mute);font-size:14px}
.num{font-size:84px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:6px 0 12px}
.num span{font-size:28px;font-weight:700;letter-spacing:0;margin-left:6px}
.bar{position:relative;height:22px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.zone{background:var(--zone)}
.fill{background:var(--p);transition:width .35s ease}
.hint{margin:8px 0 0;font-size:15px;color:var(--mute);min-height:22px}
.tbl{border-top:4px solid var(--ink);margin-top:14px}
.tr{display:grid;grid-template-columns:14px 1fr auto 52px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tr .dot{width:12px;height:12px;border-radius:3px}
.tr b{font-size:20px;font-weight:800}
.tr i{font-style:normal;color:var(--mute);text-align:right;font-size:15px}
.tr.k{border-bottom:0;border-top:4px solid var(--ink);margin-top:-1px}
.tr.k .dot{background:none}
.tr.k i{grid-column:3 / 5;text-align:right}
.share{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--track);margin:14px 0 2px}
.share i{display:block;height:100%;transition:width .35s ease}
.cap{font-size:13px;color:var(--mute);margin:0 0 6px}
.bg-p{background:var(--p)}.bg-c{background:var(--c)}.bg-f{background:var(--f)}
h2{font-size:22px;font-weight:800;margin:26px 0 4px;border-top:8px solid var(--ink);padding-top:10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
li>div{flex:1;min-width:0}
li b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{display:block;color:var(--mute);font-size:14px}
li .m span{margin-right:10px}
.cp{color:var(--p)}.cc{color:var(--c)}.cf{color:var(--f)}
li.empty{color:var(--mute);display:block}
.del{width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:18px}
.dock{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg);border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.btn{height:52px;border:2px solid var(--ink);background:var(--bg);border-radius:12px;font-weight:700;padding:0 16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%;margin-top:10px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .2s}
#sheet.open{visibility:visible;opacity:1}
.panel{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg);border-top:6px solid var(--ink);border-radius:18px 18px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(30px);transition:transform .2s}
#sheet.open .panel{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh h3{margin:0;font-size:22px;font-weight:800}
#reader{position:relative;width:100%;height:260px;background:#000;border-radius:10px;overflow:hidden}
#cam{width:100%;height:100%;object-fit:cover;display:block}
#cam.zoom{transform:scale(1.7)}
.aim{position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,60,60,.9)}
.msg{color:var(--mute);font-size:15px;margin:8px 0;min-height:20px}
label{display:block;font-size:14px;color:var(--mute);margin-top:12px}
input{display:block;width:100%;margin-top:4px;padding:12px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px}
input:focus{outline:none;border-color:var(--ink)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{margin:0}
.inline .btn{height:auto;flex:none}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:7px 14px;font-size:15px}
.pv{margin-top:14px;padding:12px 0;border-top:4px solid var(--ink);font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js" defer></script>
</head>
<body>
<header class="top">
  <button class="ib" id="prev" aria-label="Vorheriger Tag">‹</button>
  <div class="day"><b id="dLabel"></b><span id="dDate"></span></div>
  <button class="ib" id="next" aria-label="Nächster Tag">›</button>
  <button class="ib" id="gear" aria-label="Einstellungen" style="font-size:22px">⚙︎</button>
</header>

<main>
  <section class="hero">
    <div class="hl"><span>Eiweiß</span><small id="pTgt"></small></div>
    <div class="num"><b id="pVal">0</b><span>g</span></div>
    <div class="bar"><i class="zone" id="pZone"></i><i class="fill" id="pFill"></i></div>
    <p class="hint" id="pHint"></p>
  </section>

  <div class="share" id="share"></div>
  <p class="cap">Anteil an den Kalorien</p>
  <section class="tbl">
    <div class="tr"><span class="dot bg-p"></span><span>Eiweiß</span><b id="p2"></b><i id="pPct"></i></div>
    <div class="tr"><span class="dot bg-c"></span><span>Kohlenhydrate</span><b id="cVal"></b><i id="cPct"></i></div>
    <div class="tr"><span class="dot bg-f"></span><span>Fett</span><b id="fVal"></b><i id="fPct"></i></div>
    <div class="tr k"><span class="dot"></span><span>Kalorien</span><b id="kVal"></b><i id="kSub"></i></div>
  </section>

  <h2>Einträge</h2>
  <ul id="list"></ul>
</main>

<nav class="dock">
  <button class="btn pri" id="scan">Barcode scannen</button>
  <button class="btn" id="manual">Manuell</button>
</nav>

<div id="sheet"><div class="panel">
  <div id="vScan">
    <div class="sh"><h3>Barcode scannen</h3><button class="ib" data-close>✕</button></div>
    <div id="reader"><video id="cam" playsinline muted autoplay></video><div class="aim"></div></div>
    <button class="btn wide" id="photoBtn" style="margin-top:8px">Foto aufnehmen (scharf auch aus der Nähe)</button>
    <button class="btn wide" id="liveBtn" hidden>Live-Scan neu starten</button>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <p class="msg" id="scanMsg"></p>
    <div class="inline"><input id="code" inputmode="numeric" placeholder="Oder Code eintippen"><button class="btn" id="codeGo">Suchen</button></div>
    <div id="recentWrap" hidden><label>Zuletzt gegessen</label><div class="chips" id="recent"></div></div>
  </div>

  <div id="vForm" hidden>
    <div class="sh"><h3 id="fTitle">Eintrag</h3><button class="ib" data-close>✕</button></div>
    <p class="msg" id="fMsg"></p>
    <label>Produkt<input id="fName" autocomplete="off"></label>
    <label style="margin-top:14px">Nährwerte pro 100 g bzw. 100 ml</label>
    <div class="g4">
      <label>kcal<input id="fKcal" inputmode="decimal"></label>
      <label>Eiweiß<input id="fP" inputmode="decimal"></label>
      <label>Kohlenh.<input id="fC" inputmode="decimal"></label>
      <label>Fett<input id="fF" inputmode="decimal"></label>
    </div>
    <label>Menge in g oder ml<input id="fG" inputmode="decimal"></label>
    <div class="chips" id="chips"></div>
    <div class="pv" id="pv"></div>
    <button class="btn pri wide" id="add">Hinzufügen</button>
  </div>

  <div id="vSet" hidden>
    <div class="sh"><h3>Einstellungen</h3><button class="ib" data-close>✕</button></div>
    <label>Körpergewicht in kg<input id="sW" inputmode="decimal"></label>
    <div class="g2">
      <label>Eiweiß min. (g pro kg)<input id="sMin" inputmode="decimal"></label>
      <label>Eiweiß max. (g pro kg)<input id="sMax" inputmode="decimal"></label>
    </div>
    <label>Kalorienziel pro Tag<input id="sK" inputmode="numeric"></label>
    <p class="msg" id="sNote"></p>
    <button class="btn pri wide" id="sSave">Speichern</button>
    <label style="margin-top:22px">Sicherung</label>
    <button class="btn wide" id="bkSave">Sicherung speichern</button>
    <button class="btn wide" id="bkLoad">Sicherung laden</button>
    <input type="file" id="bkFile" accept=".json,application/json" hidden>
    <p class="msg" id="sMsg"></p>
    <button class="btn wide" id="export">Als CSV exportieren (für Tabellen)</button>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s), KEY = "makros.v1";
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };
const R = v => Math.round(v), dec = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

let db = null;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
db = db || {};
db.settings = Object.assign({weight: 85, fMin: 1.5, fMax: 2, kcal: 2000}, db.settings);
db.log = db.log || {}; db.products = db.products || {}; db.recent = db.recent || [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

let day = isoDay(new Date()), scanner = null, cur = {};

function targets() {
  const s = db.settings;
  return {min: R(s.weight * s.fMin), max: R(s.weight * s.fMax)};
}

function render() {
  const list = db.log[day] || [], s = db.settings, T = targets();
  const t = list.reduce((a, e) => ({kcal: a.kcal + e.kcal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f}), {kcal: 0, p: 0, c: 0, f: 0});
  const today = isoDay(new Date());
  const d = new Date(day + "T12:00:00"), y = new Date(); y.setDate(y.getDate() - 1);
  $("#dLabel").textContent = day === today ? "Heute" : day === isoDay(y) ? "Gestern" : d.toLocaleDateString("de-DE", {weekday: "long"});
  $("#dDate").textContent = d.toLocaleDateString("de-DE", {day: "numeric", month: "long", year: "numeric"});
  $("#next").disabled = day >= today;

  const sc = Math.max(T.max * 1.15, t.p * 1.05, 1);
  $("#pVal").textContent = R(t.p);
  $("#pTgt").textContent = "Ziel " + T.min + " bis " + T.max + " g";
  $("#pZone").style.left = (T.min / sc * 100) + "%";
  $("#pZone").style.width = ((T.max - T.min) / sc * 100) + "%";
  $("#pFill").style.width = Math.min(100, t.p / sc * 100) + "%";
  $("#pHint").textContent = !list.length ? "Noch nichts eingetragen." :
    t.p < T.min ? "Noch " + R(T.min - t.p) + " g bis zum Zielbereich." :
    t.p <= T.max ? "Im Zielbereich." : "Über dem Zielbereich.";

  const eP = t.p * 4, eC = t.c * 4, eF = t.f * 9, sum = eP + eC + eF;
  const pc = v => sum ? R(v / sum * 100) : 0;
  $("#share").innerHTML = sum ? `<i class="bg-p" style="width:${eP / sum * 100}%"></i><i class="bg-c" style="width:${eC / sum * 100}%"></i><i class="bg-f" style="width:${eF / sum * 100}%"></i>` : "";
  $("#p2").textContent = R(t.p) + " g"; $("#pPct").textContent = pc(eP) + " %";
  $("#cVal").textContent = R(t.c) + " g"; $("#cPct").textContent = pc(eC) + " %";
  $("#fVal").textContent = R(t.f) + " g"; $("#fPct").textContent = pc(eF) + " %";
  const rest = R(s.kcal - t.kcal);
  $("#kVal").textContent = R(t.kcal) + " kcal";
  $("#kSub").textContent = rest >= 0 ? "noch " + rest : (-rest) + " drüber";

  $("#list").innerHTML = list.length ? list.slice().reverse().map(e =>
    `<li><div><b>${esc(e.name)}</b><small>${dec(e.g)} g, ${R(e.kcal)} kcal</small><small class="m"><span class="cp">Eiweiß ${dec(e.p)}</span><span class="cc">KH ${dec(e.c)}</span><span class="cf">Fett ${dec(e.f)}</span></small></div><button class="del" data-id="${e.id}" aria-label="Eintrag löschen">✕</button></li>`).join("")
    : `<li class="empty">Noch keine Einträge. Tippe unten auf „Barcode scannen“.</li>`;
}

/* ---------- Sheet ---------- */
const views = ["vScan", "vForm", "vSet"];
const showView = id => views.forEach(v => $("#" + v).hidden = v !== id);
const openSheet = () => $("#sheet").classList.add("open");
function closeSheet() { stopScan(); $("#sheet").classList.remove("open"); }
let scanning = false;
function stopScan() {
  scanning = false;
  if (!scanner) return;
  const c = scanner; scanner = null;
  try { c.stop(); } catch (e) {}
}

function renderRecent() {
  $("#recentWrap").hidden = !db.recent.length;
  $("#recent").innerHTML = db.recent.map((r, i) => `<button class="chip" data-r="${i}">${esc(r.name)}</button>`).join("");
}

/* Prüfziffer verhindert, dass falsch gelesene Codes übernommen werden */
function validEan(c) {
  if (![8, 12, 13].includes(c.length) || /\D/.test(c)) return false;
  const d = c.split("").map(Number), chk = d.pop();
  const sum = d.reverse().reduce((a, v, i) => a + v * (i % 2 ? 1 : 3), 0);
  return (10 - sum % 10) % 10 === chk;
}

function makeReader() {
  const B = ZXingBrowser, hints = new Map();
  hints.set(2, [B.BarcodeFormat.EAN_13, B.BarcodeFormat.EAN_8, B.BarcodeFormat.UPC_A]); // POSSIBLE_FORMATS
  hints.set(3, true);                                                                     // TRY_HARDER
  return new B.BrowserMultiFormatOneDReader(hints, {delayBetweenScanAttempts: 80});
}

async function startScan() {
  showView("vScan"); openSheet(); renderRecent();
  $("#liveBtn").hidden = true;
  $("#scanMsg").textContent = "Halte das Handy etwa 15 bis 20 cm vom Barcode entfernt. Wird das Bild unscharf, geh lieber ein Stück zurück als näher heran.";
  if (!window.ZXingBrowser) { $("#scanMsg").textContent = "Der Scanner konnte nicht geladen werden. Prüfe die Internetverbindung oder tippe den Code ein."; return; }
  stopScan(); scanning = true;
  try {
    const ctl = await makeReader().decodeFromConstraints(
      {video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}}},
      $("#cam"),
      res => {
        if (!res || !scanning) return;
        const code = res.getText();
        if (!validEan(code)) return;
        stopScan(); lookup(code);
      });
    if (!scanning) { ctl.stop(); return; }
    scanner = ctl;
    /* Autofokus und Zoom nutzen, falls das Gerät sie anbietet; sonst wird nur die Vorschau vergrößert */
    let zoomed = false;
    try {
      const track = $("#cam").srcObject.getVideoTracks()[0], cap = track.getCapabilities ? track.getCapabilities() : {}, adv = [];
      if (cap.focusMode && cap.focusMode.includes("continuous")) adv.push({focusMode: "continuous"});
      if (cap.zoom) adv.push({zoom: Math.min(cap.zoom.max, Math.max(cap.zoom.min, 2))});
      if (adv.length) { await track.applyConstraints({advanced: adv}); zoomed = !!cap.zoom; }
    } catch (e) {}
    $("#cam").classList.toggle("zoom", !zoomed);
  } catch (e) {
    scanning = false; scanner = null;
    $("#scanMsg").textContent = "Kein Kamerazugriff. Erlaube die Kamera in den iPhone-Einstellungen unter Safari oder tippe den Code ein.";
  }
}

/* Foto aus der Kamera-App: scharf, auch aus kurzer Entfernung */
async function decodePhoto(file) {
  const msg = $("#scanMsg");
  if (!window.ZXingBrowser) { msg.textContent = "Der Scanner konnte nicht geladen werden."; return; }
  msg.textContent = "Foto wird ausgewertet …";
  const src = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = src; await img.decode();
    for (const max of [2200, 1400]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      try {
        const res = await makeReader().decodeFromImageUrl(cv.toDataURL("image/jpeg", 0.92));
        const code = res.getText();
        if (validEan(code)) { lookup(code); return; }
      } catch (e) {}
    }
    msg.textContent = "Im Foto wurde kein Barcode erkannt. Der Code muss scharf und quer im Bild liegen. Versuche es noch einmal.";
  } catch (e) {
    msg.textContent = "Das Foto konnte nicht geladen werden.";
  } finally { URL.revokeObjectURL(src); }
  $("#liveBtn").hidden = false;
}

async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (!code) return;
  if (code.length === 12) code = "0" + code;
  if (db.products[code]) { openForm(Object.assign({barcode: code}, db.products[code]), ""); return; }
  openForm({barcode: code}, "Suche in Open Food Facts …");
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code + ".json?fields=product_name,product_name_de,brands,nutriments,serving_quantity");
    const j = await r.json();
    if (j.status === 1 && j.product) {
      const n = j.product.nutriments || {};
      let kcal = n["energy-kcal_100g"];
      if (kcal == null && n["energy_100g"] != null) kcal = n["energy_100g"] / 4.184;
      const p = n.proteins_100g, c = n.carbohydrates_100g, f = n.fat_100g;
      if (kcal == null && [p, c, f].every(v => v != null)) kcal = 4 * num(p) + 4 * num(c) + 9 * num(f);
      const brand = j.product.brands ? " (" + j.product.brands.split(",")[0].trim() + ")" : "";
      const name = (j.product.product_name_de || j.product.product_name || "Unbekanntes Produkt") + brand;
      const missing = [kcal, p, c, f].some(v => v == null);
      openForm({barcode: code, name, kcal, p, c, f, serving: num(j.product.serving_quantity)},
        missing ? "Einige Werte fehlen in der Datenbank. Bitte prüfen und ergänzen." : "Gefunden. Bitte Menge angeben.");
      return;
    }
    openForm({barcode: code}, "Nicht gefunden. Trage die Werte pro 100 g ein, sie werden für das nächste Mal gespeichert.");
  } catch (e) {
    openForm({barcode: code}, "Keine Verbindung zur Datenbank. Trage die Werte manuell ein.");
  }
}

const setV = (sel, v) => $(sel).value = v == null ? "" : dec(num(v));
function openForm(p, msg) {
  cur = p || {}; showView("vForm"); openSheet();
  $("#fTitle").textContent = cur.barcode ? "Produkt " + cur.barcode : "Eintrag";
  $("#fMsg").textContent = msg || "";
  $("#fName").value = cur.name || "";
  setV("#fKcal", cur.kcal); setV("#fP", cur.p); setV("#fC", cur.c); setV("#fF", cur.f);
  $("#fG").value = cur.serving > 0 ? dec(cur.serving) : "100";
  const ch = [50, 100, 150, 200].map(a => `<button type="button" class="chip" data-g="${a}">${a} g</button>`);
  if (cur.serving > 0) ch.unshift(`<button type="button" class="chip" data-g="${cur.serving}">1 Portion (${dec(cur.serving)} g)</button>`);
  $("#chips").innerHTML = ch.join("");
  preview();
}

function per100() { return {kcal: num($("#fKcal").value), p: num($("#fP").value), c: num($("#fC").value), f: num($("#fF").value)}; }
function preview() {
  const v = per100(), k = num($("#fG").value) / 100;
  $("#pv").textContent = R(v.kcal * k) + " kcal, Eiweiß " + dec(v.p * k) + " g, KH " + dec(v.c * k) + " g, Fett " + dec(v.f * k) + " g";
}

function addEntry() {
  const name = $("#fName").value.trim(), g = num($("#fG").value), v = per100();
  if (!name || g <= 0) { $("#fMsg").textContent = "Bitte Produktname und Menge angeben."; return; }
  const k = g / 100;
  (db.log[day] = db.log[day] || []).push({id: Date.now() + Math.random().toString(36).slice(2, 6), name, g, kcal: v.kcal * k, p: v.p * k, c: v.c * k, f: v.f * k});
  const prod = Object.assign({name}, v);
  if (cur.barcode) db.products[cur.barcode] = prod;
  db.recent = [Object.assign({barcode: cur.barcode || ""}, prod)].concat(db.recent.filter(r => r.name !== name)).slice(0, 10);
  save(); closeSheet(); render();
}

function openSettings() {
  const s = db.settings;
  $("#sW").value = dec(s.weight); $("#sMin").value = dec(s.fMin); $("#sMax").value = dec(s.fMax); $("#sK").value = s.kcal;
  $("#sMsg").textContent = ""; settingsNote(); showView("vSet"); openSheet();
}
function settingsNote() {
  const w = num($("#sW").value), a = R(w * num($("#sMin").value)), b = R(w * num($("#sMax").value));
  $("#sNote").textContent = "Eiweißziel: " + a + " bis " + b + " g pro Tag. " +
    (db.lastBackup ? "Letzte Sicherung: " + new Date(db.lastBackup + "T12:00:00").toLocaleDateString("de-DE") + "." : "Noch keine Sicherung erstellt.");
}

async function shareFile(file) {
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: file.name}); return true; }
  } catch (e) { if (e.name === "AbortError") return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  return true;
}

async function exportCsv() {
  const rows = [["Datum", "Produkt", "Menge", "kcal", "Eiweiß_g", "Kohlenhydrate_g", "Fett_g"]];
  Object.keys(db.log).sort().forEach(d => db.log[d].forEach(e => rows.push([d, e.name, dec(e.g), R(e.kcal), dec(e.p), dec(e.c), dec(e.f)])));
  const csv = "\ufeff" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\n");
  await shareFile(new File([csv], "makros.csv", {type: "text/csv"}));
}

async function backupSave() {
  const stamp = isoDay(new Date());
  const payload = JSON.stringify({app: "makros", version: 1, exported: new Date().toISOString(), data: db});
  const ok = await shareFile(new File([payload], "makros-sicherung-" + stamp + ".json", {type: "application/json"}));
  if (!ok) return;
  db.lastBackup = stamp; save(); settingsNote();
  $("#sMsg").textContent = "Wähle im Menü „In Dateien sichern“ und dann iCloud Drive, falls du es noch nicht getan hast.";
}

function backupLoad(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), d = j && j.data;
      if (!j || j.app !== "makros" || !d || typeof d.log !== "object") throw new Error("format");
      let added = 0;
      Object.keys(d.log).forEach(k => {
        const have = db.log[k] = db.log[k] || [], ids = new Set(have.map(e => e.id));
        (d.log[k] || []).forEach(e => { if (e && e.id && !ids.has(e.id)) { have.push(e); added++; } });
      });
      Object.assign(db.products, d.products || {});
      const seen = new Set(db.recent.map(r => r.name));
      (d.recent || []).forEach(r => { if (r && !seen.has(r.name)) db.recent.push(r); });
      db.recent = db.recent.slice(0, 10);
      if (d.settings) db.settings = Object.assign(db.settings, d.settings);
      const s2 = db.settings;
      $("#sW").value = dec(s2.weight); $("#sMin").value = dec(s2.fMin); $("#sMax").value = dec(s2.fMax); $("#sK").value = s2.kcal;
      save(); render(); settingsNote();
      $("#sMsg").textContent = added + " Einträge ergänzt. Vorhandene Einträge bleiben erhalten, Einstellungen stammen aus der Sicherung.";
    } catch (e) { $("#sMsg").textContent = "Diese Datei ist keine gültige Sicherung."; }
  };
  rd.readAsText(file);
}

/* ---------- Events ---------- */
function shift(n) { const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + n); day = isoDay(d); render(); }
$("#prev").onclick = () => shift(-1);
$("#next").onclick = () => shift(1);
$("#gear").onclick = openSettings;
$("#scan").onclick = startScan;
$("#manual").onclick = () => openForm({}, "");
$("#codeGo").onclick = () => { stopScan(); lookup($("#code").value); };
$("#photoBtn").onclick = () => { stopScan(); $("#liveBtn").hidden = false; $("#photoIn").click(); };
$("#liveBtn").onclick = startScan;
$("#photoIn").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) decodePhoto(f); });
$("#add").onclick = addEntry;
$("#sSave").onclick = () => {
  db.settings = {weight: num($("#sW").value) || 85, fMin: num($("#sMin").value) || 1.5, fMax: num($("#sMax").value) || 2, kcal: num($("#sK").value) || 2000};
  save(); closeSheet(); render();
};
$("#export").onclick = exportCsv;
$("#bkSave").onclick = backupSave;
$("#bkLoad").onclick = () => $("#bkFile").click();
$("#bkFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) backupLoad(f); e.target.value = ""; });
["#sW", "#sMin", "#sMax"].forEach(s => $(s).addEventListener("input", settingsNote));
["#fKcal", "#fP", "#fC", "#fF", "#fG"].forEach(s => $(s).addEventListener("input", preview));
$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet" || e.target.hasAttribute("data-close")) closeSheet();
  if (e.target.dataset.g) { $("#fG").value = dec(num(e.target.dataset.g)); preview(); }
  if (e.target.dataset.r !== undefined) { const r = db.recent[+e.target.dataset.r]; stopScan(); openForm(Object.assign({}, r), ""); }
});
$("#list").addEventListener("click", e => {
  const id = e.target.dataset.id;
  if (!id) return;
  db.log[day] = (db.log[day] || []).filter(x => x.id !== id);
  save(); render();
});

/* ---------- Icon für den Home-Bildschirm ---------- */
(function () {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const x = c.getContext("2d");
  x.fillStyle = "#2457e6"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#ffffff"; x.font = "900 112px -apple-system, Helvetica, sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("M", 90, 98);
  $("#icon").href = c.toDataURL("image/png");
})();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
</script>
