<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Makros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Makros</title>
<link rel="apple-touch-icon" id="icon">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#10131a;--mute:#6b7280;--line:#e6eaf1;--p:#4a73ff;--c:#ffb21e;--f:#ff5f86;--ok:#1fbf8f;--track:#e8ecf3;--glow:rgba(74,115,255,.16);--sh:0 12px 32px -18px rgba(16,19,26,.3)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0e14;--card:#151a23;--ink:#f4f6fb;--mute:#8b93a3;--line:#232b37;--p:#7b9bff;--c:#ffc247;--f:#ff7f9f;--ok:#3ddba8;--track:#222a36;--glow:rgba(123,155,255,.22);--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 6px) 18px calc(env(safe-area-inset-bottom) + 160px);max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.num,.rc b,.tile b,.dc b,.cd,.lg b{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ttl{flex:1;line-height:1.2}
.ttl b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ttl span{font-size:14px;color:var(--mute)}
.ib{width:44px;height:44px;border:0;background:none;font-size:26px;font-weight:300;display:grid;place-items:center;border-radius:14px}
.ib:disabled{opacity:.25}
#dayNav{display:flex}
.hero{position:relative;width:272px;height:272px;margin:8px auto 0;display:grid;place-items:center;background:radial-gradient(closest-side,var(--glow),transparent)}
.ring{position:absolute;inset:16px;width:240px;height:240px}
.ring circle{fill:none;stroke-width:22;transform:rotate(-90deg);transform-origin:120px 120px}
.rt{stroke:var(--track)}
.rf{stroke:var(--p);stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:628.32;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1),stroke .3s}
.rf.ok{stroke:var(--ok)}
.ring line{stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:.55}
.rc{position:relative;text-align:center;line-height:1}
.rc b{display:block;font-size:76px;font-weight:800;letter-spacing:-.04em}
.rc span{display:block;font-size:17px;font-weight:600;margin-top:4px}
.rc small{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.hint{text-align:center;color:var(--mute);font-size:15px;margin:6px 0 16px;min-height:22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--sh);min-width:0}
.tile small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;white-space:nowrap}
.tile b{display:block;font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.tile em{font-style:normal;font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.k{background:var(--ink)}.bg-p{background:var(--p)}.bg-c{background:var(--c)}.bg-f{background:var(--f)}
h2{font-size:20px;font-weight:800;margin:24px 4px 10px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:6px 18px}
ul.card{list-style:none;margin:0}
li[data-k]{cursor:pointer}
li{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li>div{flex:1;min-width:0}
li b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{display:block;color:var(--mute);font-size:14px}
li .m span{margin-right:10px}
.cp{color:var(--p)}.cc{color:var(--c)}.cf{color:var(--f)}
li.empty{display:block;color:var(--mute);padding:18px 0}
.del{width:36px;height:36px;border:0;background:var(--track);border-radius:50%;color:var(--mute);font-size:14px}
.seg{display:flex;background:var(--track);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:11px;font-weight:600;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.donutc{position:relative;display:grid;place-items:center;padding:20px}
.donutc svg{width:230px;height:230px}
.dc{position:absolute;text-align:center;line-height:1.1}
.dc b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em}
.dc span{font-size:14px;color:var(--mute)}
.cap{font-size:13px;color:var(--mute);margin:12px 6px 6px}
.lg{display:grid;grid-template-columns:14px 1fr auto 52px;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg b{font-size:19px;font-weight:800}
.lg i{font-style:normal;color:var(--mute);text-align:right}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:19px;font-weight:800;text-transform:capitalize}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;padding:12px 0}
.wd{font-style:normal;text-align:center;font-size:12px;color:var(--mute)}
.cd{--pr:0;position:relative;aspect-ratio:1;border:0;border-radius:50%;padding:0;background:conic-gradient(var(--p) calc(var(--pr) * 1%),var(--track) 0);color:var(--ink);font-size:15px;font-weight:600}
.cd span{position:absolute;inset:3px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.cd[style*="--pr:0"]{background:none}
.cd[style*="--pr:0"] span{background:none;color:var(--mute)}
.cd.ok{background:var(--ok)}
.cd.ok span{background:none;color:#fff}
.cd.now{outline:2px solid var(--ink);outline-offset:2px}
.cd:disabled{opacity:.3}
.key{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--mute);margin-top:4px}
.key span{display:flex;align-items:center;gap:6px}
.fabs{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;gap:10px;z-index:5}
.pill{height:54px;border:0;border-radius:27px;padding:0 22px 0 18px;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 12px 28px -8px rgba(16,19,26,.5)}
.round{width:54px;height:54px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:30px;font-weight:300;box-shadow:0 12px 28px -10px rgba(16,19,26,.4)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;max-width:560px;margin:0 auto;padding:8px 12px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:6}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);padding:4px 0}
.tabs button.on{color:var(--ink)}
.tabs svg{width:26px;height:26px}
.btn{height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;font-weight:700;padding:0 16px;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .2s;z-index:20}
#sheet.open{visibility:visible;opacity:1}
.panel{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(30px);transition:transform .2s}
#sheet.open .panel{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh h3{margin:0;font-size:22px;font-weight:800}
#reader{position:relative;width:100%;height:260px;background:#000;border-radius:20px;overflow:hidden}
#cam{width:100%;height:100%;object-fit:cover;display:block}
#cam.zoom{transform:scale(1.7)}
.aim{position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,60,60,.9)}
.msg{color:var(--mute);font-size:15px;margin:8px 0;min-height:20px}
label{display:block;font-size:14px;color:var(--mute);margin-top:12px}
input{display:block;width:100%;margin-top:4px;padding:13px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid transparent;border-radius:14px}
input:focus{outline:none;border-color:var(--p)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{margin:0}
.inline .btn{height:auto;flex:none}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:var(--track);border-radius:999px;padding:8px 15px;font-size:15px}
.pv{margin-top:14px;padding:12px 0;border-top:1px solid var(--line);font-weight:700}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s;z-index:30}
#scrim.open{opacity:1;visibility:visible}
#side{position:fixed;top:0;bottom:0;left:0;width:min(88vw,340px);background:var(--bg);z-index:31;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top) + 16px) 20px 24px;overflow:auto;border-radius:0 28px 28px 0}
#side.open{transform:none}
.hrow{display:flex;align-items:center;justify-content:space-between}
.hrow h2{margin:24px 4px 10px}
.hrow .chip{margin-top:14px;background:var(--ink);color:var(--bg);font-weight:600}
#hNote{margin:-2px 6px 8px}
#side h4{font-size:15px;margin:26px 0 0;font-weight:800}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js" defer></script>
</head>
<body>
<header class="top">
  <button class="ib" id="gear" aria-label="Einstellungen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="ttl"><b id="dLabel"></b><span id="dDate"></span></div>
  <div id="dayNav"><button class="ib" id="prev" aria-label="Vorheriger Tag">‹</button><button class="ib" id="next" aria-label="Nächster Tag">›</button></div>
</header>

<main>
  <section id="v-today">
    <div class="hero">
      <svg class="ring" viewBox="0 0 240 240"><circle class="rt" cx="120" cy="120" r="100"/><circle class="rf" id="rFill" cx="120" cy="120" r="100"/><g id="rTick"><line x1="120" y1="9" x2="120" y2="31"/></g></svg>
      <div class="rc"><b id="pVal">0</b><span>g Eiweiß</span><small id="pTgt"></small></div>
    </div>
    <p class="hint" id="pHint"></p>
    <div class="tiles">
      <div class="tile"><small><span class="dot bg-c"></span>Kohlenhydr.</small><b id="cVal"></b></div>
      <div class="tile"><small><span class="dot bg-f"></span>Fett</small><b id="fVal"></b></div>
      <div class="tile"><small><span class="dot k"></span>Kalorien</small><b id="kVal"></b><em id="kSub"></em></div>
    </div>
    <div class="hrow"><h2>Einträge</h2><button class="chip" id="hSend">An Health senden</button></div>
    <p class="cap" id="hNote"></p>
    <ul class="card" id="list"></ul>
  </section>

  <section id="v-over" hidden>
    <div class="seg" id="seg"><button data-r="7" class="on">7 Tage</button><button data-r="30">30 Tage</button><button data-r="0">Alles</button></div>
    <div class="card donutc"><svg id="donut" viewBox="0 0 200 200"></svg><div class="dc" id="dCenter"></div></div>
    <p class="cap">Anteile an den Kalorien, Mengen als Tagesdurchschnitt</p>
    <div class="card" id="legend"></div>
    <div id="stats"></div>
  </section>

  <section id="v-prod" hidden>
    <input id="pSearch" placeholder="Produkt suchen" autocomplete="off" style="margin:0 0 12px">
    <ul class="card" id="pList"></ul>
  </section>

  <section id="v-cal" hidden>
    <div class="calh"><button class="ib" id="cPrev" aria-label="Vorheriger Monat">‹</button><b id="calTitle"></b><button class="ib" id="cNext" aria-label="Nächster Monat">›</button></div>
    <div class="card"><div class="g7" id="calGrid"></div></div>
    <p class="hint" id="calSum" style="margin-top:14px"></p>
    <div class="key"><span><i class="dot" style="background:var(--ok)"></i>Ziel erreicht</span><span><i class="dot" style="background:var(--p)"></i>teilweise</span></div>
  </section>
</main>

<div class="fabs">
  <button class="pill" id="scan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Scannen</button>
  <button class="round" id="manual" aria-label="Manuell eintragen">+</button>
</div>

<nav class="tabs" id="tabs">
  <button class="on" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>Heute</button>
  <button data-t="over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Übersicht</button>
  <button data-t="prod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.5 10.5h-11z"/><path d="M9 9l3-5 3 5"/></svg>Produkte</button>
  <button data-t="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalender</button>
</nav>

<div id="scrim"></div>
<aside id="side">
  <div class="sh"><h3>Einstellungen</h3><button class="ib" id="sideX" aria-label="Schließen">✕</button></div>
  <label>Körpergewicht in kg<input id="sW" inputmode="decimal"></label>
  <div class="g2">
    <label>Eiweiß min. (g/kg)<input id="sMin" inputmode="decimal"></label>
    <label>Eiweiß max. (g/kg)<input id="sMax" inputmode="decimal"></label>
  </div>
  <label>Kalorienziel pro Tag<input id="sK" inputmode="numeric"></label>
  <h4>Apple Health</h4>
  <label>Name des Kurzbefehls<input id="sH" autocomplete="off"></label>
  <p class="msg" id="sNote"></p>
  <button class="btn pri wide" id="sSave">Speichern</button>
  <h4>Export für die Cloud</h4>
  <button class="btn wide" id="bkSave">In iCloud Drive sichern</button>
  <button class="btn wide" id="bkLoad">Sicherung laden</button>
  <input type="file" id="bkFile" accept=".json,application/json" hidden>
  <button class="btn wide" id="export">Als CSV exportieren</button>
  <p class="msg" id="sMsg"></p>
</aside>

<div id="sheet"><div class="panel">
  <div id="vScan">
    <div class="sh"><h3>Barcode scannen</h3><button class="ib" data-close>✕</button></div>
    <div id="reader"><video id="cam" playsinline muted autoplay></video><div class="aim"></div></div>
    <button class="btn wide" id="photoBtn" style="margin-top:8px">Foto aufnehmen (scharf auch aus der Nähe)</button>
    <button class="btn wide" id="liveBtn" hidden>Live-Scan neu starten</button>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <p class="msg" id="scanMsg"></p>
    <div class="inline"><input id="code" inputmode="numeric" placeholder="Oder Code eintippen"><button class="btn" id="codeGo">Suchen</button></div>
    <div id="recentWrap" hidden><label>Zuletzt gegessen</label><div class="chips" id="recent"></div></div>
  </div>

  <div id="vForm" hidden>
    <div class="sh"><h3 id="fTitle">Eintrag</h3><button class="ib" data-close>✕</button></div>
    <p class="msg" id="fMsg"></p>
    <label>Produkt<input id="fName" autocomplete="off"></label>
    <label style="margin-top:14px">Nährwerte pro 100 g bzw. 100 ml</label>
    <div class="g4">
      <label>kcal<input id="fKcal" inputmode="decimal"></label>
      <label>Eiweiß<input id="fP" inputmode="decimal"></label>
      <label>Kohlenh.<input id="fC" inputmode="decimal"></label>
      <label>Fett<input id="fF" inputmode="decimal"></label>
    </div>
    <label>Menge in g oder ml<input id="fG" inputmode="decimal"></label>
    <div class="chips" id="chips"></div>
    <div class="pv" id="pv"></div>
    <button class="btn pri wide" id="add">Hinzufügen</button>
  </div>

</div></div>

<script>
const $ = s => document.querySelector(s), KEY = "makros.v1";
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };
const R = v => Math.round(v), dec = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

let db = null;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
db = db || {};
db.settings = Object.assign({weight: 85, fMin: 1.5, fMax: 2, kcal: 2000, hname: "Makros Health"}, db.settings);
db.log = db.log || {}; db.products = db.products || {}; db.recent = db.recent || []; db.health = db.health || {};
if (!db.libV) {
  const cnt = {}, last = {}, sample = {};
  Object.keys(db.log).forEach(k => db.log[k].forEach(e => {
    cnt[e.name] = (cnt[e.name] || 0) + 1;
    const t = new Date(k + "T12:00:00").getTime();
    if (!(last[e.name] > t)) { last[e.name] = t; sample[e.name] = e; }
  }));
  const have = new Set(Object.values(db.products).map(x => x.name));
  Object.keys(cnt).forEach(n => {
    const e = sample[n];
    if (!have.has(n) && e.g > 0) db.products["m:" + n.toLowerCase()] = {name: n, kcal: e.kcal / e.g * 100, p: e.p / e.g * 100, c: e.c / e.g * 100, f: e.f / e.g * 100};
  });
  Object.values(db.products).forEach(x => { if (x.used == null) { x.used = cnt[x.name] || 0; x.last = last[x.name] || 0; } });
  db.libV = 1;
}
if (db.hPending) {
  const o = db.health[db.hPending.day] || {kcal: 0, p: 0, c: 0, f: 0}, n = db.hPending.tot;
  db.health[db.hPending.day] = {kcal: Math.max(o.kcal, n.kcal), p: Math.max(o.p, n.p), c: Math.max(o.c, n.c), f: Math.max(o.f, n.f)};
  db.hPending = null;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

let day = isoDay(new Date()), scanner = null, cur = {}, tab = "today", range = 7, calM = (d => (d.setDate(1), d))(new Date());

function targets() {
  const s = db.settings;
  return {min: R(s.weight * s.fMin), max: R(s.weight * s.fMax)};
}

const sumList = l => l.reduce((a, e) => ({kcal: a.kcal + e.kcal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f}), {kcal: 0, p: 0, c: 0, f: 0});
const CIRC = 2 * Math.PI * 100;

function render() {
  const T = targets();
  $("#dayNav").hidden = tab !== "today";
  document.querySelector(".fabs").hidden = tab !== "today";
  if (tab === "today") renderToday(T);
  else if (tab === "over") { $("#dLabel").textContent = "Übersicht"; $("#dDate").textContent = "Deine Makros im Zeitraum"; renderOver(T); }
  else if (tab === "prod") renderProd();
  else { $("#dLabel").textContent = "Kalender"; $("#dDate").textContent = "Wann das Proteinziel erreicht wurde"; renderCal(T); }
}

function go(t) {
  tab = t;
  ["today", "over", "prod", "cal"].forEach(n => $("#v-" + n).hidden = n !== t);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  window.scrollTo(0, 0); render();
}

function renderOver(T) {
  const days = [];
  if (range) for (let i = 0; i < range; i++) { const d = new Date(); d.setDate(d.getDate() - i); days.push(isoDay(d)); }
  else days.push(...Object.keys(db.log));
  const o = {n: 0, kcal: 0, p: 0, c: 0, f: 0, hit: 0};
  days.forEach(k => {
    const l = db.log[k] || []; if (!l.length) return;
    const t = sumList(l); o.n++; o.kcal += t.kcal; o.p += t.p; o.c += t.c; o.f += t.f; if (t.p >= T.min) o.hit++;
  });
  const e = [o.p * 4, o.c * 4, o.f * 9], sum = e[0] + e[1] + e[2], C = 2 * Math.PI * 70, n = o.n || 1;
  const col = ["var(--p)", "var(--c)", "var(--f)"], names = ["Eiweiß", "Kohlenhydrate", "Fett"], g = [o.p, o.c, o.f];
  let off = 0, svg = `<circle cx="100" cy="100" r="70" fill="none" stroke="var(--track)" stroke-width="30"/>`;
  if (sum) e.forEach((v, i) => {
    const len = v / sum * C;
    if (len > 0) svg += `<circle cx="100" cy="100" r="70" fill="none" stroke="${col[i]}" stroke-width="30" stroke-dasharray="${Math.max(0, len - 3)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
    off += len;
  });
  $("#donut").innerHTML = svg;
  $("#dCenter").innerHTML = o.n ? `<b>${R(o.kcal / n).toLocaleString("de-DE")}</b><span>kcal pro Tag</span>` : `<span>Noch keine Daten<br>in diesem Zeitraum</span>`;
  $("#legend").innerHTML = names.map((nm, i) =>
    `<div class="lg"><span class="dot" style="background:${col[i]}"></span><span>${nm}</span><b>${o.n ? R(g[i] / n) : 0} g</b><i>${sum ? R(e[i] / sum * 100) : 0} %</i></div>`).join("");
  $("#stats").innerHTML = [["Tage erfasst", o.n], ["Proteinziel erreicht", o.hit + " von " + o.n], ["Ø Eiweiß", R(o.p / n) + " g"], ["Ø Kalorien", R(o.kcal / n) + " kcal"]]
    .map(([a, b]) => `<div class="tile"><small>${a}</small><b>${b}</b></div>`).join("");
}

/* Prüfziffer verhindert, dass falsch gelesene Codes übernommen werden */
function validEan(c) {
  if (![8, 12, 13].includes(c.length) || /\D/.test(c)) return false;
  const d = c.split("").map(Number), chk = d.pop();
  const sum = d.reverse().reduce((a, v, i) => a + v * (i % 2 ? 1 : 3), 0);
  return (10 - sum % 10) % 10 === chk;
}

function makeReader() {
  const B = ZXingBrowser, hints = new Map();
  hints.set(2, [B.BarcodeFormat.EAN_13, B.BarcodeFormat.EAN_8, B.BarcodeFormat.UPC_A]); // POSSIBLE_FORMATS
  hints.set(3, true);                                                                     // TRY_HARDER
  return new B.BrowserMultiFormatOneDReader(hints, {delayBetweenScanAttempts: 80});
}

async function startScan() {
  showView("vScan"); openSheet(); renderRecent();
  $("#liveBtn").hidden = true;
  $("#scanMsg").textContent = "Halte das Handy etwa 15 bis 20 cm vom Barcode entfernt. Wird das Bild unscharf, geh lieber ein Stück zurück als näher heran.";
  if (!window.ZXingBrowser) { $("#scanMsg").textContent = "Der Scanner konnte nicht geladen werden. Prüfe die Internetverbindung oder tippe den Code ein."; return; }
  stopScan(); scanning = true;
  try {
    const ctl = await makeReader().decodeFromConstraints(
      {video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}}},
      $("#cam"),
      res => {
        if (!res || !scanning) return;
        const code = res.getText();
        if (!validEan(code)) return;
        stopScan(); lookup(code);
      });
    if (!scanning) { ctl.stop(); return; }
    scanner = ctl;
    /* Autofokus und Zoom nutzen, falls das Gerät sie anbietet; sonst wird nur die Vorschau vergrößert */
    let zoomed = false;
    try {
      const track = $("#cam").srcObject.getVideoTracks()[0], cap = track.getCapabilities ? track.getCapabilities() : {}, adv = [];
      if (cap.focusMode && cap.focusMode.includes("continuous")) adv.push({focusMode: "continuous"});
      if (cap.zoom) adv.push({zoom: Math.min(cap.zoom.max, Math.max(cap.zoom.min, 2))});
      if (adv.length) { await track.applyConstraints({advanced: adv}); zoomed = !!cap.zoom; }
    } catch (e) {}
    $("#cam").classList.toggle("zoom", !zoomed);
  } catch (e) {
    scanning = false; scanner = null;
    $("#scanMsg").textContent = "Kein Kamerazugriff. Erlaube die Kamera in den iPhone-Einstellungen unter Safari oder tippe den Code ein.";
  }
}

/* Foto aus der Kamera-App: scharf, auch aus kurzer Entfernung */
async function decodePhoto(file) {
  const msg = $("#scanMsg");
  if (!window.ZXingBrowser) { msg.textContent = "Der Scanner konnte nicht geladen werden."; return; }
  msg.textContent = "Foto wird ausgewertet …";
  const src = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = src; await img.decode();
    for (const max of [2200, 1400]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      try {
        const res = await makeReader().decodeFromImageUrl(cv.toDataURL("image/jpeg", 0.92));
        const code = res.getText();
        if (validEan(code)) { lookup(code); return; }
      } catch (e) {}
    }
    msg.textContent = "Im Foto wurde kein Barcode erkannt. Der Code muss scharf und quer im Bild liegen. Versuche es noch einmal.";
  } catch (e) {
    msg.textContent = "Das Foto konnte nicht geladen werden.";
  } finally { URL.revokeObjectURL(src); }
  $("#liveBtn").hidden = false;
}

async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (!code) return;
  if (code.length === 12) code = "0" + code;
  if (db.products[code]) { openForm(Object.assign({barcode: code}, db.products[code]), ""); return; }
  openForm({barcode: code}, "Suche in Open Food Facts …");
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code + ".json?fields=product_name,product_name_de,brands,nutriments,serving_quantity");
    const j = await r.json();
    if (j.status === 1 && j.product) {
      const n = j.product.nutriments || {};
      let kcal = n["energy-kcal_100g"];
      if (kcal == null && n["energy_100g"] != null) kcal = n["energy_100g"] / 4.184;
      const p = n.proteins_100g, c = n.carbohydrates_100g, f = n.fat_100g;
      if (kcal == null && [p, c, f].every(v => v != null)) kcal = 4 * num(p) + 4 * num(c) + 9 * num(f);
      const brand = j.product.brands ? " (" + j.product.brands.split(",")[0].trim() + ")" : "";
      const name = (j.product.product_name_de || j.product.product_name || "Unbekanntes Produkt") + brand;
      const missing = [kcal, p, c, f].some(v => v == null);
      openForm({barcode: code, name, kcal, p, c, f, serving: num(j.product.serving_quantity)},
        missing ? "Einige Werte fehlen in der Datenbank. Bitte prüfen und ergänzen." : "Gefunden. Bitte Menge angeben.");
      return;
    }
    openForm({barcode: code}, "Nicht gefunden. Trage die Werte pro 100 g ein, sie werden für das nächste Mal gespeichert.");
  } catch (e) {
    openForm({barcode: code}, "Keine Verbindung zur Datenbank. Trage die Werte manuell ein.");
  }
}

async function shareFile(file) {
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: file.name}); return true; }
  } catch (e) { if (e.name === "AbortError") return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  return true;
}

  const csv = "\ufeff" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\n");

function backupLoad(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), d = j && j.data;
      if (!j || j.app !== "makros" || !d || typeof d.log !== "object") throw new Error("format");
      let added = 0;
      Object.keys(d.log).forEach(k => {
        const have = db.log[k] = db.log[k] || [], ids = new Set(have.map(e => e.id));
        (d.log[k] || []).forEach(e => { if (e && e.id && !ids.has(e.id)) { have.push(e); added++; } });
      });
      Object.assign(db.products, d.products || {});
      const seen = new Set(db.recent.map(r => r.name));
      (d.recent || []).forEach(r => { if (r && !seen.has(r.name)) db.recent.push(r); });
      db.recent = db.recent.slice(0, 10);
      if (d.settings) db.settings = Object.assign(db.settings, d.settings);
      const s2 = db.settings;
      $("#sW").value = dec(s2.weight); $("#sMin").value = dec(s2.fMin); $("#sMax").value = dec(s2.fMax); $("#sK").value = s2.kcal;
      save(); render(); settingsNote();
      $("#sMsg").textContent = added + " Einträge ergänzt. Vorhandene Einträge bleiben erhalten, Einstellungen stammen aus der Sicherung.";
    } catch (e) { $("#sMsg").textContent = "Diese Datei ist keine gültige Sicherung."; }
  };
  rd.readAsText(file);
}

/* ---------- Apple Health über Kurzbefehle ---------- */
function sendHealth() {
  const t = sumList(db.log[day] || []), sent = db.health[day] || {kcal: 0, p: 0, c: 0, f: 0};
  const d1 = v => Math.max(0, Math.round(v * 10) / 10);
  const dl = {kcal: Math.max(0, R(t.kcal - sent.kcal)), p: d1(t.p - sent.p), c: d1(t.c - sent.c), f: d1(t.f - sent.f)};
  if (!dl.kcal && !dl.p && !dl.c && !dl.f) { $("#hNote").textContent = "Es gibt nichts Neues zu senden."; return; }
  const now = new Date(), when = day === isoDay(now) ? now : new Date(day + "T12:00:00");
  dl.date = isoDay(when) + "T" + when.toTimeString().slice(0, 8);
  db.hLast = {day, prev: sent};   /* sofort merken, damit nichts doppelt gesendet wird */
  db.health[day] = {kcal: Math.max(sent.kcal, t.kcal), p: Math.max(sent.p, t.p), c: Math.max(sent.c, t.c), f: Math.max(sent.f, t.f)};
  save(); renderHealthNote();
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(db.settings.hname || "Makros Health") +
    "&input=text&text=" + encodeURIComponent(JSON.stringify(dl));
}

function renderHealthNote() {
  const hl = db.hLast, hs = db.health[day];
  if (hl) {
    const lbl = new Date(hl.day + "T12:00:00").toLocaleDateString("de-DE", {day: "numeric", month: "long"});
    $("#hNote").innerHTML = `Gesendet für ${lbl}. Hat es nicht geklappt?<span class="chips"><button class="chip" data-h="undo">Zurücksetzen</button><button class="chip" data-h="ok">Passt</button></span>`;
  } else {
    $("#hNote").textContent = hs ? "An Apple Health gesendet: " + R(hs.kcal) + " kcal, " + R(hs.p) + " g Eiweiß." : "";
  }
}

    return;
  }
  const li = e.target.closest("li[data-k]"), x = li && db.products[li.dataset.k];
  if (!x) return;
  day = isoDay(new Date());
  openForm(Object.assign({}, x, {barcode: li.dataset.k.startsWith("m:") ? "" : li.dataset.k}), "");
});
$("#hNote").addEventListener("click", e => {
  const a = e.target.dataset.h, hl = db.hLast;
  if (!a || !hl) return;
  if (a === "undo") db.health[hl.day] = hl.prev;
  db.hLast = null; save(); renderHealthNote();
  if (a === "undo") $("#hNote").textContent = "Zurückgesetzt. Der nächste Versand sendet diese Werte erneut.";
});
$("#bkLoad").onclick = () => $("#bkFile").click();
$("#bkFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) backupLoad(f); e.target.value = ""; });
["#sW", "#sMin", "#sMax"].forEach(s => $(s).addEventListener("input", settingsNote));
["#fKcal", "#fP", "#fC", "#fF", "#fG"].forEach(s => $(s).addEventListener("input", preview));
$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet" || e.target.hasAttribute("data-close")) closeSheet();
  if (e.target.dataset.g) { $("#fG").value = dec(num(e.target.dataset.g)); preview(); }
  if (e.target.dataset.r !== undefined) { const r = db.recent[+e.target.dataset.r]; stopScan(); openForm(Object.assign({}, r), ""); }
});
$("#list").addEventListener("click", e => {
  const id = e.target.dataset.id;
  if (!id) return;
  db.log[day] = (db.log[day] || []).filter(x => x.id !== id);
  save(); render();
});

/* ---------- Icon für den Home-Bildschirm ---------- */
(function () {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const x = c.getContext("2d");
  x.fillStyle = "#4a73ff"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#ffffff"; x.font = "900 112px -apple-system, Helvetica, sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("M", 90, 98);
  $("#icon").href = c.toDataURL("image/png");
})();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
</script>
</body>
</html>
